<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KASA">
<title>KASA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon/icon-180.png">
<link rel="stylesheet" href="app.css?s=6">
</head>
<body>

<div id="kabuk">

  <!-- Mobilde alt bar, masaüstünde yan panel — aynı öğe -->
  <aside id="yan">
    <div class="marka">
      <span class="marka-ikon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2" class="dolu"/><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6"/></svg>
      </span>
      <span class="marka-ad">KASA</span>
    </div>

    <nav id="anaNav">
      <button data-gorunum="bugun" class="aktif">
        <svg viewBox="0 0 24 24" class="nav-ikon"><path d="M9 11.5l2.4 2.4L20 5.3"/><path d="M20.5 12v6.8a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2V5.6a2 2 0 0 1 2-2h10.2"/></svg>
        <span>Bugün</span></button>
      <button data-gorunum="hafta">
        <svg viewBox="0 0 24 24" class="nav-ikon"><rect x="3.2" y="4.6" width="17.6" height="16.2" rx="2.4"/><path d="M16 2.8v3.6M8 2.8v3.6M3.2 10h17.6"/></svg>
        <span>Hafta</span></button>

      <button data-gorunum="gelen" class="yakala">
        <svg viewBox="0 0 24 24" class="nav-ikon arti"><path d="M12 5.5v13M5.5 12h13"/></svg>
        <span>Yakala</span></button>

      <button data-gorunum="takvim">
        <svg viewBox="0 0 24 24" class="nav-ikon"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.1 2.1"/></svg>
        <span>Takvim</span></button>
      <button data-gorunum="biriken">
        <svg viewBox="0 0 24 24" class="nav-ikon"><path d="M21 12.5h-5.2l-1.6 2.6H9.8l-1.6-2.6H3"/><path d="M6.3 5.1 3 12.5v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5l-3.3-7.4a2 2 0 0 0-1.8-1.2H8.1a2 2 0 0 0-1.8 1.2z"/></svg>
        <span>Biriken</span></button>
    </nav>

    <div class="yan-dip">
      <div class="yan-durum" id="yanDurum"></div>
    </div>
  </aside>

  <div id="ana">
    <header id="ustBar">
      <div class="ust-sol">
        <h1 id="baslik">Bugün</h1>
        <div id="altBaslik" class="alt-baslik"></div>
      </div>
      <div class="ust-sag">
        <button id="senkronBtn" class="ikon-btn" aria-label="Senkronize et" title="Senkronize et">
          <svg viewBox="0 0 24 24" class="ikon"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6M20.5 3.5v5.2h-5.2"/></svg>
        </button>
        <button id="ayarBtn" class="ikon-btn" aria-label="Ayarlar" title="Ayarlar">
          <svg viewBox="0 0 24 24" class="ikon"><circle cx="12" cy="12" r="2.9"/><path d="M18.8 14.8a1.5 1.5 0 0 0 .3 1.7l.05.05a2 2 0 1 1-2.8 2.8l-.05-.05a1.5 1.5 0 0 0-1.7-.3 1.5 1.5 0 0 0-.9 1.4v.15a2 2 0 1 1-4 0v-.08a1.5 1.5 0 0 0-1-1.4 1.5 1.5 0 0 0-1.7.3l-.05.05a2 2 0 1 1-2.8-2.8l.05-.05a1.5 1.5 0 0 0 .3-1.7 1.5 1.5 0 0 0-1.4-.9H3a2 2 0 1 1 0-4h.08a1.5 1.5 0 0 0 1.4-1 1.5 1.5 0 0 0-.3-1.7l-.05-.05a2 2 0 1 1 2.8-2.8l.05.05a1.5 1.5 0 0 0 1.7.3H9a1.5 1.5 0 0 0 .9-1.4V3a2 2 0 1 1 4 0v.08a1.5 1.5 0 0 0 .9 1.4 1.5 1.5 0 0 0 1.7-.3l.05-.05a2 2 0 1 1 2.8 2.8l-.05.05a1.5 1.5 0 0 0-.3 1.7V9a1.5 1.5 0 0 0 1.4.9H21a2 2 0 1 1 0 4h-.08a1.5 1.5 0 0 0-1.4.9z"/></svg>
        </button>
      </div>
    </header>

    <div id="senkronSerit" class="senkron-serit gizli"></div>

    <!-- ---------- Gelen Kutusu bestecisi (kalıcı DOM — yazdığın kaybolmaz) ---------- -->
    <section id="besteci" class="besteci gizli">
      <div class="sekmeler">
        <button class="sekme aktif" data-sekme="not">Not</button>
        <button class="sekme" data-sekme="gorev">Görev</button>
        <button class="sekme" data-sekme="etkinlik">Etkinlik</button>
      </div>

      <!-- NOT / LOG -->
      <div class="sekme-icerik" data-icerik="not">
        <div class="tur-secim" id="turSecim">
          <button class="tur aktif" data-tur="not"     title="Serbest not">📝 Not</button>
          <button class="tur" data-tur="sonuc"         title="Yapıldı / tamamlandı">✅ Yapıldı</button>
          <button class="tur" data-tur="fikir"         title="Fikir">💡 Fikir</button>
          <button class="tur" data-tur="arastir"       title="Araştırılacak">🔍 Araştır</button>
        </div>

        <textarea id="yakalaNot" rows="3" placeholder="Aklından geçeni yaz… “Woodu numuneleri aldım”, “fuar standı için şunu araştır”, aklına gelen her şey."></textarea>

        <div id="ekListesi" class="ek-listesi"></div>

        <div id="kayitPanel" class="kayit-panel gizli">
          <span class="kayit-nokta"></span>
          <span id="kayitSure" class="kayit-sure">0:00</span>
          <button class="kayit-dur" id="kayitDur">Durdur ve ekle</button>
          <button class="kayit-iptal" id="kayitIptal">İptal</button>
        </div>

        <div class="ek-araclar">
          <button class="ek-btn" id="ekKamera"  title="Fotoğraf çek">📷<span>Kamera</span></button>
          <button class="ek-btn" id="ekGaleri"  title="Görsel/dosya ekle">🖼️<span>Görsel</span></button>
          <button class="ek-btn" id="ekSes"     title="Sesli not">🎤<span>Ses</span></button>
          <button class="ek-btn" id="ekLink"    title="Bağlantı ekle">🔗<span>Link</span></button>
        </div>

        <input type="file" id="dosyaKamera" accept="image/*" capture="environment" class="gizli">
        <input type="file" id="dosyaGaleri" accept="image/*,application/pdf" multiple class="gizli">

        <button class="birincil" id="notKaydet">Gelen kutusuna ekle</button>
      </div>

      <!-- GÖREV -->
      <div class="sekme-icerik gizli" data-icerik="gorev">
        <input id="yakalaGorev" type="text" placeholder="Görev metni">
        <div class="satir-alanlar">
          <label class="alan"><span class="alan-etiket">Tarih</span><input id="yakalaGorevTarih" type="date"></label>
          <label class="alan"><span class="alan-etiket">Süre</span><input id="yakalaGorevSure" type="text" placeholder="~30dk"></label>
        </div>
        <label class="alan"><span class="alan-etiket">Proje</span>
          <input id="yakalaGorevProje" type="text" placeholder="Ferrini, Packt, Kuşadası…" list="projeListesi"></label>
        <datalist id="projeListesi"></datalist>
        <button class="birincil" id="gorevKaydet">Görev ekle</button>
      </div>

      <!-- ETKİNLİK -->
      <div class="sekme-icerik gizli" data-icerik="etkinlik">
        <input id="yakalaEtkinlik" type="text" placeholder="Etkinlik adı">
        <div class="satir-alanlar">
          <label class="alan"><span class="alan-etiket">Tarih</span><input id="yakalaEtkinlikTarih" type="date"></label>
          <label class="alan"><span class="alan-etiket">Saat</span><input id="yakalaEtkinlikSaat" type="time"></label>
        </div>
        <button class="birincil" id="etkinlikKaydet">Takvime ekle</button>
      </div>
    </section>

    <main id="icerik"><div class="yukleniyor"><span class="spin"></span>Yükleniyor…</div></main>
  </div>
</div>

<!-- ------------------------------- ayarlar ------------------------------- -->
<div id="ayarKatman" class="katman gizli" role="dialog" aria-modal="true">
  <div class="katman-arka" data-kapat></div>
  <div class="sayfa">
    <div class="sayfa-tut"></div>
    <div class="sayfa-ust"><h2>Ayarlar</h2><button class="kapat-btn" data-kapat aria-label="Kapat">✕</button></div>

    <span class="alan-etiket">Arayüz boyutu</span>
    <div class="olcek-secim" id="olcekSecim">
      <button data-olcek="1">Normal</button>
      <button data-olcek="1.2">Büyük</button>
      <button data-olcek="1.4">Daha büyük</button>
      <button data-olcek="1.65">Devasa</button>
    </div>
    <p class="ipucu">Tüm arayüz orantılı büyür — yazı, düğme, ikon, boşluk. İstediğin gibi dene, anında uygulanır.</p>

    <label class="alan"><span class="alan-etiket">GitHub kullanıcı adı</span>
      <input id="ayarOwner" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="alan"><span class="alan-etiket">Veri deposu (private)</span>
      <input id="ayarRepo" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="alan"><span class="alan-etiket">Erişim anahtarı</span>
      <input id="ayarToken" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></label>
    <p class="ipucu">Anahtar yalnızca bu cihazda saklanır. Yalnızca veri deposunda <b>Contents: Read&nbsp;and&nbsp;write</b> izni yeterlidir.</p>

    <button class="birincil" id="ayarKaydet">Kaydet ve bağlan</button>
    <div class="dugme-satir">
      <button class="ikincil" id="ayarYenile">Yeniden çek</button>
      <button class="tehlike" id="ayarSil">Anahtarı sil</button>
    </div>
    <div id="ayarDurum" class="ayar-durum"></div>
  </div>
</div>

<!-- ------------------------------- görev detayı ------------------------------- -->
<div id="gorevKatman" class="katman gizli" role="dialog" aria-modal="true">
  <div class="katman-arka" data-kapat></div>
  <div class="sayfa" id="gorevSayfa"></div>
</div>

<div id="bildirim" class="bildirim gizli"></div>

<script src="app.js?s=6"></script>
</body>
</html>
